[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "monatq"
description = "Approximate quantile tracking for tensors, with element-wise parallel updates and selectable summary kernels"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Monakhov" }]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "numpy",
    "torch==2.7.0",
    "torchvision==0.22.0",
]

[project.urls]
Repository = "https://github.com/vladim0105/monatq"
